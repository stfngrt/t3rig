version: "0.2"
name: two-seat
summary: A lead and an implementer, for trying openrigt3.
culture_file: culture.md
pods:
  - id: dev
    label: Development
    members:
      - id: lead
        agent_ref: "local:agents/lead"
        profile: default
        runtime: claude-code
        model: claude-haiku-5-5
        cwd: .
      - id: impl
        agent_ref: "local:agents/impl"
        profile: default
        runtime: claude-code
        model: claude-haiku-5-5
        cwd: .
    edges:
      - kind: delegates_to
        from: lead
        to: impl
