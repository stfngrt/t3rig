[project]
name = "t3rig"
version = "0.1.0"
description = "Run OpenRig-compatible rig specs as T3 Code threads"
authors = [
    { name = "Stefan Engert", email = "6205109+stfngrt@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
t3rig = "t3rig.cli:main"

[project.optional-dependencies]
serve = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "t3rig[serve]",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "httpx2>=2.16.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
    "sphinx-argparse>=0.6.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinxext-opengraph>=0.13.0",
]

[tool.uv]
default-groups = ["dev", "docs"]
