[project]
name = "openrigt3"
version = "0.1.0"
description = "Run OpenRig-compatible rig specs as T3 Code threads"
authors = [
    { name = "Stefan Engert", email = "6205109+stfngrt@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
openrigt3 = "openrigt3.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
