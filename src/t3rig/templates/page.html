<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ rig }} · t3rig</title>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/sse.js"></script>
  <link rel="stylesheet" href="/static/page.css">
</head>
<body hx-ext="sse" sse-connect="/api/stream">
  <main>
    <!-- One section per rig, so a multi-rig view can list several. -->
    <section class="rig" data-rig="{{ rig }}" aria-labelledby="rig-name">
      <header class="top">
        <h1 id="rig-name">{{ rig }}</h1>
        <div id="summary" sse-swap="summary" aria-live="polite">{{ summary|safe }}</div>
      </header>
      <div class="layout">
        <div class="side" id="issues" sse-swap="issues">{{ issues|safe }}</div>
        <div class="main" id="seats" sse-swap="seats">{{ seats|safe }}</div>
      </div>
      <!-- Only the summary line and the list are swapped, so an open log stays open. -->
      <details class="log">
        <summary>
          <span class="log-title">Activity</span>
          <span class="log-latest" id="log-latest" sse-swap="latest">{{ latest|safe }}</span>
        </summary>
        <ol class="log-list" id="log-list" sse-swap="events">{{ events|safe }}</ol>
      </details>
      <footer class="health" id="health" sse-swap="health">{{ health|safe }}</footer>
    </section>
  </main>
</body>
</html>
